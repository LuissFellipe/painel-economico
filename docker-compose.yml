services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bcb
      POSTGRES_PASSWORD: bcb
      POSTGRES_DB: bcb
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcb"]
      interval: 5s
      retries: 10

  pipeline:
    build: ./pipeline
    environment:
      PGHOST: postgres
      PGPORT: 5432
      HORA_EXECUCAO: 8
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    environment:
      DATABASE_URL: postgresql+psycopg://bcb:bcb@postgres:5432/bcb
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
