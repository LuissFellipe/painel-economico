version: 2

models:
  - name: stg_bcb__series
    description: Uma observação por série e data, com o valor tipado.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [codigo_serie, data]
    columns:
      - name: nome_serie
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['selic_meta', 'ipca_mensal', 'dolar_venda']
      - name: data
        tests: [not_null]
      - name: valor
        tests: [not_null]
